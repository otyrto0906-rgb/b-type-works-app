<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B型制作部 作業管理アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   B型制作部 作業管理アプリ
   デザイントークン（提案資料のブランド＝墨×金 を継承）
   ============================================================ */
:root{
  --sumi:#23211D;        /* 墨（ブランド黒） */
  --sumi-2:#3A3731;
  --gold:#B8912F;        /* 金（ブランドアクセント） */
  --gold-2:#C9A24B;
  --gold-pale:#F6EFDD;
  --cream:#FAF8F3;       /* アプリ背景 */
  --card:#FFFFFF;
  --line:#E5E1D8;
  --ink:#2B2925;
  --ink-soft:#6E695F;
  --ok:#3E7C4F;
  --ok-pale:#EAF3EC;
  --ng:#B0492E;
  --ng-pale:#F9ECE7;
  --info-pale:#EEF1F6;
  --radius:14px;
  --shadow:0 2px 10px rgba(35,33,29,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--cream);color:var(--ink);line-height:1.7;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ふりがな表示切替：body.furigana のときだけ rt を表示 */
ruby rt{display:none;font-size:.5em;color:var(--ink-soft);font-weight:500}
body.furigana ruby rt{display:revert}

/* ---------- 共通パーツ ---------- */
.eyebrow{
  font-size:.68rem;letter-spacing:.32em;color:var(--gold);
  font-weight:700;text-transform:uppercase;
}
.chip{
  display:inline-flex;align-items:center;gap:.35em;
  font-size:.75rem;font-weight:700;padding:.2em .7em;border-radius:999px;
}
.chip.status-not_started{background:#EFEDE7;color:var(--ink-soft)}
.chip.status-in_progress{background:var(--gold-pale);color:var(--gold)}
.chip.status-submitted{background:var(--info-pale);color:#3D5A8A}
.chip.status-returned{background:var(--ng-pale);color:var(--ng)}
.chip.status-approved{background:var(--ok-pale);color:var(--ok)}
.chip.diff{background:var(--gold-pale);color:var(--gold)}
.chip.ready{background:var(--ok-pale);color:var(--ok)}
.chip.prep{background:#EFEDE7;color:var(--ink-soft)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-weight:700;border-radius:12px;transition:transform .06s, box-shadow .15s, background .15s;
  padding:.65em 1.3em;font-size:.95rem;
}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#A57F26}
.btn-sumi{background:var(--sumi);color:#fff}
.btn-sumi:hover{background:#000}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ng{background:var(--ng);color:#fff}
.btn-big{font-size:1.15rem;padding:.9em 1.6em;border-radius:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-goldtop{border-top:4px solid var(--gold)}

/* ---------- ヘッダー ---------- */
header.app{
  background:var(--sumi);color:#fff;position:sticky;top:0;z-index:50;
}
.app-inner{
  max-width:1180px;margin:0 auto;padding:.7rem 1.2rem;
  display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:.7rem}
.logo-mark{display:grid;grid-template-columns:repeat(2,10px);gap:3px}
.logo-mark span{width:10px;height:10px;border:1.5px solid #5b564c}
.logo-mark span.g{border-color:var(--gold-2)}
.logo-text b{font-size:1.05rem;font-weight:900;letter-spacing:.05em}
.logo-text small{display:block;font-size:.6rem;letter-spacing:.28em;color:var(--gold-2)}
nav.roles{display:flex;gap:.4rem;margin-left:auto}
.role-tab{
  color:#CFC9BC;font-weight:700;font-size:.9rem;padding:.5em 1em;border-radius:10px;
}
.role-tab:hover{color:#fff}
.role-tab.active{background:var(--gold);color:#fff}
a.ext-link{text-decoration:none;border:1px solid #5b564c;color:var(--gold-2)}
a.ext-link:hover{border-color:var(--gold);color:#fff;background:rgba(184,145,47,.15)}
.db-chip{
  font-size:.68rem;color:#CFC9BC;border:1px dashed #5b564c;border-radius:8px;
  padding:.25em .7em;letter-spacing:.05em;
}
.db-chip b{color:var(--gold-2)}

main{max-width:1180px;margin:0 auto;padding:1.6rem 1.2rem 4rem}

/* ---------- ホーム（モード選択） ---------- */
.home-hero{margin:1.5rem 0 2.2rem}
.home-hero h1{font-size:clamp(1.5rem,3.5vw,2.2rem);font-weight:900;line-height:1.4;margin-top:.4rem}
.home-hero h1 em{font-style:normal;color:var(--gold)}
.home-hero p{color:var(--ink-soft);margin-top:.6rem;max-width:38em}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem}
.mode-card{padding:1.6rem;text-align:left;display:block;width:100%}
.mode-card:hover{border-color:var(--gold)}
.mode-card .icon{font-size:2rem}
.mode-card h2{font-size:1.25rem;font-weight:900;margin:.5rem 0 .3rem}
.mode-card p{color:var(--ink-soft);font-size:.9rem}
.mode-card .go{margin-top:1rem;color:var(--gold);font-weight:700;font-size:.9rem}

/* ---------- 見出し ---------- */
.page-head{margin-bottom:1.4rem;display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.page-head h1{font-size:1.45rem;font-weight:900;line-height:1.3;margin-top:.2rem}
.page-head .sub{color:var(--ink-soft);font-size:.9rem}
.page-head .right{margin-left:auto;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

/* ---------- 利用者：自分をえらぶ ---------- */
.user-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.user-pick .card{padding:1.3rem;text-align:center}
.user-pick .card:hover{border-color:var(--gold)}
.avatar{
  width:64px;height:64px;border-radius:50%;background:var(--gold-pale);
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto .6rem;
}
.user-pick b{font-size:1.1rem;font-weight:900}
.user-pick small{display:block;color:var(--ink-soft)}

/* ---------- 利用者：きょうのしごと ---------- */
.task-list{display:grid;gap:1rem}
.task-card{padding:1.2rem 1.4rem;display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.task-card .t-icon{
  width:56px;height:56px;border-radius:14px;background:var(--gold-pale);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none;
}
.task-card .t-main{flex:1;min-width:220px}
.task-card .t-main b{font-size:1.1rem;font-weight:900}
.task-card .t-meta{display:flex;gap:.6rem;align-items:center;margin-top:.3rem;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft)}
.mini-bar{height:8px;background:#EFEDE7;border-radius:99px;overflow:hidden;margin-top:.55rem;max-width:340px}
.mini-bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.returned-note{margin-top:.5rem;font-size:.85rem;color:var(--ng);font-weight:700}

/* ---------- 利用者：作業画面 ---------- */
.work-top{padding:1.4rem 1.6rem;margin-bottom:1.2rem}
.work-top-row{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.work-top h1{font-size:1.4rem;font-weight:900;line-height:1.35}
.work-meta{display:flex;gap:.7rem;margin-top:.4rem;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft);align-items:center}
.work-actions{margin-left:auto;display:flex;gap:.6rem;flex-wrap:wrap}
.progress-wrap{margin-top:1.1rem}
.progress-label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.progress-label b{color:var(--gold);font-size:1rem}
.progress{height:14px;background:#EFEDE7;border-radius:99px;overflow:hidden;margin-top:.3rem}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:99px;transition:width .3s}
.staff-msg{
  margin-top:1rem;background:var(--ng-pale);border:1.5px solid #E4C0B2;border-radius:12px;
  padding: .9rem 1.1rem;font-size:.95rem;
}
.staff-msg b{color:var(--ng)}

.step-list{display:grid;gap:.9rem}
.step{
  display:flex;gap:1rem;align-items:flex-start;padding:1.15rem 1.3rem;
}
.step.done{background:var(--ok-pale);border-color:#BFDCC6}
.step.locked{opacity:.5}
.step-num{
  flex:none;width:46px;height:46px;border-radius:50%;background:var(--sumi);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;
}
.step.done .step-num{background:var(--ok)}
.step-body{flex:1;min-width:200px}
.step-body h3{font-size:1.08rem;font-weight:900}
.step-body p{font-size:.92rem;color:var(--ink-soft);margin-top:.15rem}
.step-ok-hint{
  margin-top:.5rem;font-size:.85rem;background:var(--gold-pale);color:#8a6c1f;
  border-radius:8px;padding:.35em .8em;display:inline-block;
}
.step-btn{
  flex:none;min-width:120px;padding:.8em 1.1em;border-radius:14px;font-weight:900;font-size:1rem;
  background:#fff;border:2px solid var(--line);color:var(--ink-soft);
}
.step-btn:hover{border-color:var(--gold);color:var(--gold)}
.step.done .step-btn{background:var(--ok);border-color:var(--ok);color:#fff}

/* チェックリスト */
.checklist-sec{margin-top:1.6rem;padding:1.4rem 1.6rem}
.checklist-sec h2{font-size:1.2rem;font-weight:900;margin-bottom:.2rem}
.checklist-sec .lead{color:var(--ink-soft);font-size:.9rem;margin-bottom:1rem}
.cl-group{margin-top:1rem}
.cl-group h3{font-size:.85rem;letter-spacing:.15em;color:var(--gold);font-weight:900;border-bottom:2px solid var(--gold-pale);padding-bottom:.3rem;margin-bottom:.5rem}
.cl-item{
  display:flex;gap:.8rem;align-items:center;padding:.65rem .5rem;border-radius:10px;cursor:pointer;
}
.cl-item:hover{background:var(--gold-pale)}
.cl-item input{width:22px;height:22px;accent-color:var(--gold);flex:none;cursor:pointer}
.cl-item span{font-size:.98rem}
.submit-zone{margin-top:1.4rem;text-align:center}
.submit-zone .note{font-size:.85rem;color:var(--ink-soft);margin-top:.5rem}

/* 提出完了 */
.done-hero{text-align:center;padding:3rem 1rem}
.done-hero .big{font-size:3.4rem}
.done-hero h1{font-size:1.6rem;font-weight:900;margin:.6rem 0 .3rem}
.done-hero p{color:var(--ink-soft)}

/* ---------- 指導員 ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.4rem}
.kpi{padding:1rem 1.2rem}
.kpi .n{font-size:1.9rem;font-weight:900;color:var(--gold)}
.kpi .l{font-size:.8rem;color:var(--ink-soft);font-weight:700}
.section-title{font-size:1.05rem;font-weight:900;margin:1.6rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
.section-title .count{background:var(--gold);color:#fff;border-radius:99px;font-size:.75rem;padding:.1em .7em}

table.mgr{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table.mgr th{
  background:var(--sumi);color:#fff;font-size:.78rem;letter-spacing:.08em;text-align:left;
  padding:.7rem 1rem;font-weight:700;white-space:nowrap;
}
table.mgr td{padding:.85rem 1rem;border-top:1px solid var(--line);font-size:.92rem;vertical-align:middle}
table.mgr tr:hover td{background:var(--gold-pale)}
.tbl-bar{display:flex;align-items:center;gap:.6rem;min-width:160px}
.tbl-bar .mini-bar{flex:1;margin:0}
.tbl-bar small{color:var(--ink-soft);font-weight:700;white-space:nowrap}

/* 検収画面 */
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:820px){.review-grid{grid-template-columns:1fr}}
.review-col{padding:1.3rem 1.5rem}
.review-col h2{font-size:1.05rem;font-weight:900;margin-bottom:.8rem;display:flex;gap:.5rem;align-items:center}
.rv-step{display:flex;gap:.7rem;align-items:center;padding:.5rem .3rem;border-bottom:1px dashed var(--line);font-size:.93rem}
.rv-step:last-child{border-bottom:none}
.rv-badge{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900}
.rv-badge.yes{background:var(--ok-pale);color:var(--ok)}
.rv-badge.no{background:#EFEDE7;color:var(--ink-soft)}
.rv-check{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .3rem;border-bottom:1px dashed var(--line);font-size:.9rem}
.rv-check:last-child{border-bottom:none}
.rv-check .self{flex:none;font-size:.7rem;font-weight:900;border-radius:6px;padding:.15em .5em;margin-top:.15em}
.rv-check .self.y{background:var(--ok-pale);color:var(--ok)}
.rv-check .self.n{background:var(--ng-pale);color:var(--ng)}
.rv-check input{width:20px;height:20px;accent-color:var(--ok);margin-top:.2em;cursor:pointer}
.review-actions{margin-top:1.2rem;padding:1.3rem 1.5rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.review-actions textarea{
  flex:1;min-width:240px;border:1.5px solid var(--line);border-radius:10px;padding:.7em 1em;
  font-family:inherit;font-size:.92rem;min-height:70px;resize:vertical;
}
.review-actions textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}

/* ---------- マニュアル書庫 ---------- */
.lib-cat{margin-bottom:2rem}
.lib-cat-head{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.lib-cat-head .mark{
  width:38px;height:38px;border-radius:10px;background:var(--sumi);color:var(--gold-2);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;
}
.lib-cat-head h2{font-size:1.1rem;font-weight:900}
.lib-cat-head small{color:var(--ink-soft)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.lib-card{padding:1.15rem 1.3rem;display:flex;flex-direction:column;gap:.5rem}
.lib-card .top{display:flex;align-items:center;gap:.6rem}
.lib-card .code{font-weight:900;color:var(--gold);letter-spacing:.05em}
.lib-card b{font-size:1.02rem;font-weight:900;line-height:1.4}
.lib-card .desc{font-size:.85rem;color:var(--ink-soft);flex:1}
.lib-card .foot{display:flex;gap:.5rem;align-items:center;margin-top:.4rem}
.lib-card .ver{font-size:.72rem;color:var(--ink-soft);margin-left:auto}

/* ---------- マニュアルモーダル ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(35,33,29,.55);z-index:100;
  display:none;align-items:center;justify-content:center;padding:1rem;
}
.modal-bg.open{display:flex}
.modal{
  background:#fff;border-radius:18px;max-width:820px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{background:var(--sumi);color:#fff;padding:1.1rem 1.5rem;display:flex;align-items:flex-start;gap:1rem}
.modal-head .eyebrow{color:var(--gold-2)}
.modal-head h2{font-size:1.2rem;font-weight:900;margin-top:.15rem}
.modal-head .meta{font-size:.78rem;color:#CFC9BC;margin-top:.3rem;display:flex;gap:1rem;flex-wrap:wrap}
.modal-close{
  margin-left:auto;flex:none;width:38px;height:38px;border-radius:10px;background:#3A3731;color:#fff;
  font-size:1.1rem;font-weight:900;
}
.modal-close:hover{background:var(--gold)}
.modal-tabs{display:flex;border-bottom:2px solid var(--line);background:#FCFBF7;overflow-x:auto}
.modal-tab{
  padding:.8em 1.3em;font-weight:900;font-size:.9rem;color:var(--ink-soft);white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-2px;
}
.modal-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.modal-body{padding:1.4rem 1.6rem;overflow-y:auto}
.man-sec{margin-bottom:1.5rem}
.man-sec h3{font-size:.82rem;letter-spacing:.2em;color:var(--gold);font-weight:900;margin-bottom:.5rem}
.man-goal{
  background:var(--gold-pale);border-radius:12px;padding:1rem 1.2rem;font-size:.95rem;
}
.man-goal .ph{
  background:#fff;border:2px dashed var(--gold-2);border-radius:10px;height:120px;
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:.85rem;
  margin-bottom:.7rem;
}
.man-tools li{list-style:none;padding:.35rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.man-step{display:flex;gap:.9rem;padding:.9rem 0;border-bottom:1px dashed var(--line)}
.man-step:last-child{border-bottom:none}
.man-step .n{
  flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;
}
.man-step b{display:block;font-size:.98rem}
.man-step p{font-size:.88rem;color:var(--ink-soft)}
.man-step .okline{font-size:.82rem;color:#8a6c1f;background:var(--gold-pale);border-radius:6px;padding:.15em .6em;display:inline-block;margin-top:.3rem}
.man-qa{background:#FCFBF7;border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.7rem}
.man-qa b{color:var(--gold)}
.man-qa p{font-size:.9rem;margin-top:.2rem}
.sample-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
.sample{
  border-radius:10px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;font-size:.85rem;gap:.2rem;border:2px solid;
}
.sample.okx{background:var(--ok-pale);border-color:#BFDCC6;color:var(--ok)}
.sample.ngx{background:var(--ng-pale);border-color:#E4C0B2;color:var(--ng)}
.sample small{font-weight:500;font-size:.72rem;color:var(--ink-soft)}
.man-help{background:var(--info-pale);border-radius:12px;padding:1rem 1.2rem;font-size:.92rem}

/* こまったモーダル */
.help-modal{max-width:480px;text-align:center;padding:2.2rem 1.8rem}
.help-modal .big{font-size:3rem}
.help-modal h2{font-size:1.3rem;font-weight:900;margin:.5rem 0}
.help-modal p{color:var(--ink-soft);font-size:.95rem;margin-bottom:1.2rem}

/* トースト */
#toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--sumi);color:#fff;padding:.8em 1.6em;border-radius:12px;font-weight:700;
  opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--gold-2)}

.back-link{color:var(--gold);font-weight:700;font-size:.9rem;display:inline-flex;gap:.3em;align-items:center;margin-bottom:.8rem}

/* ---------- 管理画面（割当・利用者・データ） ---------- */
.manage-card{padding:1.2rem 1.4rem;margin-bottom:.4rem}
.form-grid{display:flex;flex-wrap:wrap;gap:.9rem;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:.35rem}
.field>span{font-size:.78rem;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.field input[type=text],.field select{
  font-family:inherit;font-size:.95rem;padding:.55em .8em;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  min-width:200px;
}
.field input[type=text]:focus,.field select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.icon-pick{display:flex;flex-wrap:wrap;gap:.4rem;max-width:340px}
.icon-pick button{
  width:40px;height:40px;font-size:1.25rem;border:2px solid var(--line);
  border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;
}
.icon-pick button:hover{border-color:var(--gold-2)}
.icon-pick button.sel{border-color:var(--gold);background:var(--gold-pale)}
.mg-empty{padding:1.1rem 1.3rem;color:var(--ink-soft);font-size:.92rem}
.data-actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.data-note{font-size:.82rem;color:var(--ink-soft);margin-top:.7rem;line-height:1.7}
.danger-line{border-top:1px dashed var(--line);margin-top:1.1rem;padding-top:1.1rem}
.btn-danger{background:#fff;border:1.5px solid #E4C0B2;color:var(--ng)}
.btn-danger:hover{background:var(--ng-pale)}

/* ---------- PINロック ---------- */
.pin-wrap{display:flex;justify-content:center;padding:2rem 0}
.pin-card{max-width:380px;width:100%;text-align:center;padding:2rem 1.6rem}
.pin-card .big{font-size:2.4rem}
.pin-card h1{font-size:1.3rem;font-weight:900;margin:.4rem 0 .2rem}
.pin-card p{color:var(--ink-soft);font-size:.9rem;margin-bottom:1rem}
.pin-dots{display:flex;justify-content:center;gap:.8rem;margin:1rem 0}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:.15s}
.pin-dots span.on{background:var(--gold);border-color:var(--gold)}
.pin-msg{color:var(--ng);font-weight:700;font-size:.85rem;margin-bottom:.6rem}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:260px;margin:0 auto}
.pin-pad button{height:56px;font-size:1.3rem;font-weight:900;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.pin-pad button:hover{border-color:var(--gold);color:var(--gold)}
.pin-pad button.sub{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.pin-forgot{margin-top:1rem;font-size:.78rem;color:var(--ink-soft);text-decoration:underline;background:none}
.pin-forgot:hover{color:var(--ng)}

@media(max-width:640px){
  html{font-size:15px}
  .step{flex-direction:column}
  .step-btn{width:100%}
  .work-actions{margin-left:0;width:100%}
  .work-actions .btn{flex:1}
  .field input[type=text],.field select{min-width:0;width:100%}
  .field{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>

/* ============================================================
   永続化レイヤー（localStorage）
   ★ Supabase移行時は saveDB / loadDB の中身だけを
     API呼び出しに差し替えれば、他の画面コードは無変更で動きます ★
   ============================================================ */
const DB_KEY = 'btype-works-db-v1';

/* 初期デモデータのスナップショット（「デモデータに戻す」用） */
const DEMO = JSON.parse(JSON.stringify({
  users: DB.users, staff: DB.staff, assignments: DB.assignments,
}));

function setSaveChip(text){
  const c = $('#saveChip'); if (!c) return;
  if (text){ c.innerHTML = text; return; }
  const d = new Date();
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  c.innerHTML = `💾 この端末に<b>保存済み</b>（${hm}）`;
}

function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify({
      v: 1, savedAt: new Date().toISOString(),
      users: DB.users, staff: DB.staff, assignments: DB.assignments,
      settings: DB.settings,
    }));
    setSaveChip();
  }catch(e){
    setSaveChip('💾 <b>保存できませんでした</b>');
  }
}

/* データの検証・補正（マニュアル改訂でステップ数が変わった場合等に追従） */
function normalizeData(d){
  if (!d || !Array.isArray(d.users) || !Array.isArray(d.assignments)) return null;
  const users = d.users.filter(u => u && u.id && u.name)
    .map(u => ({ id:String(u.id), name:String(u.name), icon:u.icon||'🙂', facility:u.facility||'' }));
  const staff = (Array.isArray(d.staff) && d.staff.length && d.staff[0].name)
    ? [{ id:'s1', name:String(d.staff[0].name) }] : JSON.parse(JSON.stringify(DEMO.staff));
  const assignments = d.assignments
    .filter(a => a && a.id && manual(a.manualId) && users.some(u => u.id === a.userId))
    .map(a => {
      const n = manual(a.manualId).steps.length;
      const steps = Array.isArray(a.stepsDone) ? a.stepsDone.map(Boolean) : [];
      while (steps.length < n) steps.push(false);
      steps.length = n;
      return {
        id:String(a.id), userId:String(a.userId), manualId:String(a.manualId),
        status: ['not_started','in_progress','submitted','returned','approved'].includes(a.status) ? a.status : 'not_started',
        stepsDone: steps,
        checksDone: Array.isArray(a.checksDone) ? a.checksDone.filter(Number.isInteger) : [],
        staffChecks: Array.isArray(a.staffChecks) ? a.staffChecks.filter(Number.isInteger) : [],
        comment: typeof a.comment === 'string' ? a.comment : '',
        submittedAt: a.submittedAt || null,
        assignedAt: a.assignedAt || null,
      };
    });
  return { users, staff, assignments };
}

function applyData(d){
  DB.users = d.users; DB.staff = d.staff; DB.assignments = d.assignments;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return false;
    const obj = JSON.parse(raw);
    const d = normalizeData(obj);
    if (!d) return false;
    applyData(d);
    /* PINは端末設定：バックアップファイルの読み込みでは変更されない */
    DB.settings.staffPin = (obj.settings && /^\d{4}$/.test(String(obj.settings.staffPin || '')))
      ? String(obj.settings.staffPin) : '';
    return true;
  }catch(e){ return false; }
}

/* 書き出し（バックアップ／運営ハブへの共有用JSONファイル） */
function exportDB(){
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const blob = new Blob([JSON.stringify({
    v: 1, app: 'b-type-works', exportedAt: d.toISOString(),
    users: DB.users, staff: DB.staff, assignments: DB.assignments,
  }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `B型制作部_データ_${ymd}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇ データを<b>書き出しました</b>（ダウンロードフォルダをご確認ください）');
}

/* 読み込み（別端末のバックアップを復元） */
function importDB(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = normalizeData(JSON.parse(r.result));
      if (!d){ toast('⚠ このファイルは<b>読み込めません</b>（形式が違います）'); return; }
      if (!confirm(`読み込むと、この端末の現在のデータは置き換えられます。\n（読み込む内容：利用者 ${d.users.length}名／割当 ${d.assignments.length}件）\nよろしいですか？`)) return;
      applyData(d); saveDB(); go('staff');
      toast('⬆ データを<b>読み込みました</b>');
    }catch(e){ toast('⚠ このファイルは<b>読み込めません</b>'); }
  };
  r.readAsText(file);
}

    pinTarget = { name, params }; pinBuf = ''; pinMsg = '';
    route = { name:'pin' }; render(); window.scrollTo(0,0); return;
  }
  route = { name, ...params }; render(); window.scrollTo(0,0);
}

document.querySelectorAll('[data-nav]').forEach(b =>
  b.addEventListener('click', () => go(b.dataset.nav))
);

function render(){
  document.querySelectorAll('[data-nav]').forEach(b => {
    const base = { home:'home', user:'user', userTasks:'user', work:'work', doneHero:'user',
                   staff:'staff', review:'staff', manage:'staff', pin:'staff', library:'library' }[route.name];
    b.classList.toggle('active', b.dataset.nav === (base === 'work' ? 'user' : base));
  });
  const views = { home:vHome, user:vUserPick, userTasks:vUserTasks, work:vWork, doneHero:vDoneHero,
                  staff:vStaff, review:vReview, manage:vManage, pin:vPinLock, library:vLibrary };
  $('#view').innerHTML = views[route.name]();
  bind();
}

function vWork(){
  const a = DB.assignments.find(x => x.id === route.asId);
  const m = manual(a.manualId), u = user(a.userId);
  const doneCount = a.stepsDone.filter(Boolean).length;
  const allSteps = doneCount === a.stepsDone.length;
  const checks = flatChecks(m);
  const allChecks = checks.length > 0 && a.checksDone.length === checks.length;
  const waiting = a.status === 'submitted';

  const groups = [
    ['さぎょうチェック（内容が正しいか）', m.checklist.work, 0],
    ['ていさいチェック（サイズ・ファイル名）', m.checklist.format, m.checklist.work.length],
    ['ていしゅつチェック（出す・報告）', m.checklist.submit, m.checklist.work.length + m.checklist.format.length],
  ];

  return `
  <button class="back-link" data-go="userTasks" data-userid="${u.id}">← しごとの一覧にもどる</button>

  <div class="card card-goldtop work-top">
    <div class="work-top-row">
      <div>
        <span class="eyebrow">${m.id} ／ ${m.catName}</span>
        <h1>${m.icon} ${m.title}</h1>
        <div class="work-meta">
          <span class="chip diff">${stars(m.diff)} ${diffName(m.diff)}</span>
          <span>⏱ めやす ${m.time}</span>
          <span>📄 マニュアル ver.${m.ver}</span>
        </div>
      </div>
      <div class="work-actions">
        <button class="btn btn-sumi" data-manual="${m.id}">📖 マニュアルを<ruby>見<rt>み</rt></ruby>る</button>
        <button class="btn btn-ghost" id="helpBtn">🙋 こまったときは</button>
        <button class="btn btn-ghost" id="furiBtn">ふりがな：<b id="furiState"></b></button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>すすみぐあい</span><b>${doneCount} / ${a.stepsDone.length} ステップ</b></div>
      <div class="progress"><i style="width:${stepPct(a)}%"></i></div>
    </div>
    ${a.status === 'returned' && a.comment ? `
      <div class="staff-msg"><b>📝 職員さんから：</b>${a.comment}</div>` : ''}
    ${waiting ? `
      <div class="staff-msg" style="background:var(--info-pale);border-color:#C6D0E0"><b style="color:#3D5A8A">⏳ ていしゅつずみ：</b>いま職員さんがかくにんしています。すこし待っていてください。</div>` : ''}
  </div>

  <div class="step-list">
    ${m.steps.map((s, i) => {
      const done = a.stepsDone[i];
      const locked = waiting;
      return `
      <div class="card step ${done ? 'done' : ''} ${locked ? 'locked' : ''}">
        <div class="step-num">${done ? '✓' : i+1}</div>
        <div class="step-body">
          <h3>STEP${i+1}：${s.t}</h3>
          <p>${s.d}</p>
          <span class="step-ok-hint">✔ ${s.ok}</span>
        </div>
        <button class="step-btn" data-step="${i}" ${locked ? 'disabled' : ''}>
          ${done ? 'できた！' : 'できたら<br>おす'}
        </button>
      </div>`;
    }).join('')}
  </div>

  ${allSteps ? `
  <div class="card card-goldtop checklist-sec">
    <span class="eyebrow">FINAL CHECK</span>
    <h2>さいごのチェックリスト</h2>
    <p class="lead">ぜんぶのステップができました！ 出す前に、ひとつずつ<ruby>確認<rt>かくにん</rt></ruby>しましょう。</p>
    ${groups.map(([title, items, base]) => items.length ? `
      <div class="cl-group">
        <h3>${title}</h3>
        ${items.map((c, i) => {
          const idx = base + i;
          const on = a.checksDone.includes(idx);
          return `<label class="cl-item"><input type="checkbox" data-check="${idx}" ${on?'checked':''} ${waiting?'disabled':''}><span>${c}</span></label>`;
        }).join('')}
      </div>` : '').join('')}
    <div class="submit-zone">
      <button class="btn btn-gold btn-big" id="submitBtn" ${(!allChecks || waiting) ? 'disabled' : ''}>
        ${waiting ? '⏳ かくにん待ちです' : '📮 ていしゅつする'}
      </button>
      ${!allChecks && !waiting ? `<div class="note">チェックがぜんぶ入ると、ていしゅつできます。</div>` : ''}
    </div>
  </div>` : ''}`;
}

/* ============================================================
   イベントバインド
   ============================================================ */
function bind(){
  const v = $('#view');

  v.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.go === 'userTasks') go('userTasks', { userId: b.dataset.userid });
    else go(b.dataset.go);
  }));
  v.querySelectorAll('[data-pickuser]').forEach(b =>
    b.addEventListener('click', () => go('userTasks', { userId: b.dataset.pickuser })));
  v.querySelectorAll('[data-openwork]').forEach(b =>
    b.addEventListener('click', () => {
      const a = DB.assignments.find(x => x.id === b.dataset.openwork);
      if (a.status === 'not_started'){ a.status = 'in_progress'; saveDB(); }
      go('work', { asId: a.id });
    }));

  /* ステップ完了トグル */
  v.querySelectorAll('[data-step]').forEach(b =>
    b.addEventListener('click', () => {
      const a = DB.assignments.find(x => x.id === route.asId);
      const i = +b.dataset.step;
      a.stepsDone[i] = !a.stepsDone[i];
      if (!a.stepsDone.every(Boolean)) a.checksDone = [];   // 未完了に戻したらチェックはリセット
      if (a.status === 'returned') a.status = 'in_progress';
      saveDB();
      render();
      if (a.stepsDone[i]) toast(`✅ <b>STEP${i+1}</b> できました！`);
    }));

  /* 本人チェックリスト */
  v.querySelectorAll('[data-check]').forEach(c =>
    c.addEventListener('change', () => {
      const a = DB.assignments.find(x => x.id === route.asId);
      const i = +c.dataset.check;
      a.checksDone = c.checked ? [...a.checksDone, i] : a.checksDone.filter(x => x !== i);
      saveDB();
      render();
    }));

  /* 提出 */
  const sb = v.querySelector('#submitBtn');
  if (sb) sb.addEventListener('click', () => {
    const a = DB.assignments.find(x => x.id === route.asId);
    if (a.status === 'submitted') return;
    a.status = 'submitted';
    a.staffChecks = [];
    const d = new Date();
    a.submittedAt = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    saveDB();
    go('doneHero', { asId: a.id });
  });

  /* 指導員：検収 */
  v.querySelectorAll('[data-review]').forEach(b =>
    b.addEventListener('click', () => go('review', { asId: b.dataset.review })));
  v.querySelectorAll('[data-staffcheck]').forEach(c =>
    c.addEventListener('change', () => {
      const a = DB.assignments.find(x => x.id === route.asId);
      const i = +c.dataset.staffcheck;
      a.staffChecks = c.checked ? [...a.staffChecks, i] : a.staffChecks.filter(x => x !== i);
      saveDB();
    }));
  const ap = v.querySelector('#approveBtn');
  if (ap) ap.addEventListener('click', () => {
    const a = DB.assignments.find(x => x.id === route.asId);
    const total = flatChecks(manual(a.manualId)).length;
    if (a.staffChecks.length < total && !confirm(`職員確認が ${a.staffChecks.length}/${total} 項目です。このまま合格にしますか？`)) return;
    a.status = 'approved'; a.comment = '';
    saveDB();
    toast(`🎉 <b>${user(a.userId).name}</b>さんの提出を合格にしました`);
    go('staff');
  });
  const rt = v.querySelector('#returnBtn');
  if (rt) rt.addEventListener('click', () => {
    const a = DB.assignments.find(x => x.id === route.asId);
    const c = v.querySelector('#rvComment').value.trim();
    if (!c) { toast('↩ 差し戻しには<b>コメント</b>が必要です'); return; }
    a.status = 'returned'; a.comment = c;
    saveDB();
    toast(`↩ <b>${user(a.userId).name}</b>さんへ差し戻しました`);
    go('staff');
  });

  /* ---------- 管理画面：割当 ---------- */
  const asgAdd = v.querySelector('#asgAddBtn');
  if (asgAdd) asgAdd.addEventListener('click', () => {
    const userId = v.querySelector('#asgUser').value;
    const manualId = v.querySelector('#asgManual').value;
    const m = manual(manualId), u = user(userId);
    if (!m || !u) return;
    const dup = DB.assignments.find(a => a.userId === userId && a.manualId === manualId && a.status !== 'approved');
    if (dup){ toast(`⚠ <b>${u.name}</b>さんには「${m.title}」がすでに割当済みです`); return; }
    DB.assignments.push({
      id: genId('as'), userId, manualId, status: 'not_started',
      stepsDone: m.steps.map(() => false),
      checksDone: [], staffChecks: [], comment: '', submittedAt: null,
      assignedAt: todayStr(),
    });
    saveDB(); render();
    toast(`📌 <b>${u.name}</b>さんに「${m.title}」を割り当てました`);
  });

  v.querySelectorAll('[data-delasg]').forEach(b =>
    b.addEventListener('click', () => {
      const a = DB.assignments.find(x => x.id === b.dataset.delasg);
      if (!a) return;
      const m = manual(a.manualId), u = user(a.userId);
      const warn = a.status === 'submitted' ? '\n※ この割当は「検収まち」です。提出内容も消えます。' : '';
      if (!confirm(`${u.name}さんの「${m.title}」の割当を削除します。進捗も消えます。${warn}\nよろしいですか？`)) return;
      DB.assignments = DB.assignments.filter(x => x.id !== a.id);
      saveDB(); render();
      toast('🗑 割当を<b>削除しました</b>');
    }));

  /* ---------- 管理画面：利用者 ---------- */
  const iconPick = v.querySelector('#iconPick');
  if (iconPick) iconPick.addEventListener('click', e => {
    const b = e.target.closest('button[data-icon]'); if (!b) return;
    iconPick.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  });

  const usrSave = v.querySelector('#usrSaveBtn');
  if (usrSave) usrSave.addEventListener('click', () => {
    const name = v.querySelector('#usrName').value.trim();
    const facility = v.querySelector('#usrFac').value.trim();
    const icon = (v.querySelector('#iconPick .sel') || {}).dataset?.icon || ICON_SET[0];
    if (!name){ toast('⚠ <b>名前</b>を入力してください'); return; }
    if (editUserId){
      const u = user(editUserId);
      if (u){ u.name = name; u.facility = facility; u.icon = icon; }
      editUserId = null;
      saveDB(); render();
      toast(`✏️ <b>${name}</b>さんの情報を更新しました`);
    } else {
      DB.users.push({ id: genId('u'), name, icon, facility });
      saveDB(); render();
      toast(`👥 <b>${name}</b>さんを追加しました`);
    }
  });
  const usrCancel = v.querySelector('#usrCancelBtn');
  if (usrCancel) usrCancel.addEventListener('click', () => { editUserId = null; render(); });

  v.querySelectorAll('[data-edituser]').forEach(b =>
    b.addEventListener('click', () => { editUserId = b.dataset.edituser; render(); window.scrollTo(0,0); }));

  v.querySelectorAll('[data-deluser]').forEach(b =>
    b.addEventListener('click', () => {
      const u = user(b.dataset.deluser); if (!u) return;
      const n = DB.assignments.filter(a => a.userId === u.id).length;
      const warn = n ? `\n※ ${u.name}さんの割当 ${n}件（進捗・提出をふくむ）も一緒に削除されます。` : '';
      if (!confirm(`${u.name}さんを削除します。${warn}\nよろしいですか？`)) return;
      DB.users = DB.users.filter(x => x.id !== u.id);
      DB.assignments = DB.assignments.filter(a => a.userId !== u.id);
      if (editUserId === u.id) editUserId = null;
      saveDB(); render();
      toast(`🗑 <b>${u.name}</b>さんを削除しました`);
    }));

  /* ---------- 管理画面：データ ---------- */
  const exp = v.querySelector('#expBtn');
  if (exp) exp.addEventListener('click', exportDB);
  const impBtn = v.querySelector('#impBtn'), impFile = v.querySelector('#impFile');
  if (impBtn) impBtn.addEventListener('click', () => impFile.click());
  if (impFile) impFile.addEventListener('change', () => {
    if (impFile.files[0]) importDB(impFile.files[0]);
    impFile.value = '';
  });
  const stSave = v.querySelector('#staffSaveBtn');
  if (stSave) stSave.addEventListener('click', () => {
    const n = v.querySelector('#staffName').value.trim();
    if (!n){ toast('⚠ 職員名を入力してください'); return; }
    DB.staff[0].name = n; saveDB(); render();
    toast('💾 職員名を<b>保存しました</b>');
  });
  const demoBtn = v.querySelector('#demoBtn');
  if (demoBtn) demoBtn.addEventListener('click', () => {
    if (!confirm('現在のデータを消して、最初のデモデータに戻します。\n（必要なら先に「データを書き出す」でバックアップしてください）\nよろしいですか？')) return;
    applyData(JSON.parse(JSON.stringify(DEMO)));
    saveDB(); render();
    toast('↺ <b>デモデータ</b>に戻しました');
  });
  const wipeBtn = v.querySelector('#wipeBtn');
  if (wipeBtn) wipeBtn.addEventListener('click', () => {
    if (!confirm('利用者・割当をすべて削除して、空の状態から実運用を始めます。\n（必要なら先に「データを書き出す」でバックアップしてください）\nよろしいですか？')) return;
    applyData({ users: [], staff: DB.staff, assignments: [] });
    saveDB(); render();
    toast('🗑 データを<b>空にしました</b>。利用者の登録から始めてください');
  });

  /* ---------- PINロック ---------- */
  v.querySelectorAll('[data-pin]').forEach(b =>
    b.addEventListener('click', () => {
      if (pinBuf.length >= 4) return;
      pinBuf += b.dataset.pin;
      if (pinBuf.length === 4){
        if (pinBuf === DB.settings.staffPin){
          staffUnlocked = true;
          const t = pinTarget || { name:'staff', params:{} };
          pinTarget = null; pinBuf = ''; pinMsg = '';
          go(t.name, t.params);
        } else {
          pinMsg = '番号がちがいます。もういちど入力してください。';
          pinBuf = ''; render();
        }
      } else render();
    }));
  const pcl = v.querySelector('[data-pinclear]');
  if (pcl) pcl.addEventListener('click', () => { pinBuf = ''; pinMsg = ''; render(); });
  const pbk = v.querySelector('[data-pinback]');
  if (pbk) pbk.addEventListener('click', () => { pinBuf = pinBuf.slice(0, -1); render(); });
  const pfg = v.querySelector('#pinForgot');
  if (pfg) pfg.addEventListener('click', () => {
    if (!confirm('番号を忘れた場合は、安全のため、この端末のデータをすべて削除してロックを解除します。\n（利用者・割当・進捗が消えます。バックアップファイルがあれば、あとで「読み込み」で復元できます）\n本当に削除して解除しますか？')) return;
    localStorage.removeItem(DB_KEY);
    location.reload();
  });

  const lk = v.querySelector('#lockBtn');
  if (lk) lk.addEventListener('click', () => {
    staffUnlocked = false;
    toast('🔒 指導員モードを<b>ロックしました</b>');
    go('home');
  });

  const pset = v.querySelector('#pinSetBtn');
  if (pset) pset.addEventListener('click', () => {
    const val = v.querySelector('#pinInput').value.trim();
    if (!/^\d{4}$/.test(val)){ toast('⚠ 番号は<b>4けたの数字</b>で入力してください'); return; }
    DB.settings.staffPin = val;
    staffUnlocked = true;   // 設定した本人のセッションは継続
    saveDB(); render();
    toast('🔒 ロック番号を<b>設定しました</b>');
  });
  const poff = v.querySelector('#pinOffBtn');
  if (poff) poff.addEventListener('click', () => {
    if (!confirm('ロックを解除して、番号なしにします。よろしいですか？')) return;
    DB.settings.staffPin = '';
    saveDB(); render();
    toast('🔓 ロックを<b>解除しました</b>');
  });

  /* マニュアル・ヘルプ */
  v.querySelectorAll('[data-manual]').forEach(b =>
    b.addEventListener('click', () => openManual(b.dataset.manual)));
  const hb = v.querySelector('#helpBtn');
  if (hb) hb.addEventListener('click', openHelp);
  v.querySelectorAll('[data-editmanual]').forEach(b =>
    b.addEventListener('click', () => toast('✏️ マニュアル編集は<b>DB連携後</b>に有効になります')));
  const nm = v.querySelector('#newManualBtn');
  if (nm) nm.addEventListener('click', () => toast('＋ 新規作成フォームは<b>DB連携後</b>に有効になります'));

  /* ふりがな切替 */
  const fb = v.querySelector('#furiBtn');
  if (fb){
    const sync = () => { const s = v.querySelector('#furiState'); if (s) s.textContent = document.body.classList.contains('furigana') ? 'ON' : 'OFF'; };
    sync();
    fb.addEventListener('click', () => { document.body.classList.toggle('furigana'); sync(); });
  }
}

/* モーダル内イベント（動的生成のため委譲） */
$('#modalBox').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-closemodal')) closeModal();
  if (t.dataset.mantab) openManual(t.dataset.manid, t.dataset.mantab);
  if (t.id === 'callStaff'){ closeModal(); toast('🔔 職員さんに<b>おしらせ</b>しました。すこし待っていてください。'); }
});

/* ---------- 起動 ---------- */
const restored = loadDB();
render();
setSaveChip(restored ? undefined : '💾 この端末に<b>自動保存</b>（初回はデモデータ）');
</script>
</body>
</html>
